name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Uygulama Windows'ta kullanılır; Linux kod tabanının platformdan bağımsız kısmını doğrular
        os: [windows-latest, ubuntu-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # sentence-transformers'ın istediği torch: CPU sürümü (CUDA'lı PyPI paketi gereksiz yere GB'larca)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          # Geliştirme araçlarından yalnızca testlerin kullandıkları (paketleme araçları gerekmez)
          pip install $(grep -E '^(ruff|vulture)==' requirements-dev.txt)

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m pytest -q -rs
