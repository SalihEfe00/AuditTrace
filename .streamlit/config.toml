# AuditTrace — kaynaktan çalıştırma (`streamlit run app.py`) için Streamlit ayarları.
# Paket başlatıcısı (packaging/launcher.py) aynı ayarları kendisi verir. tests/test_streamlit_config.py korur.

[server]
# Yalnızca bu bilgisayar: belgeler yerel ağdaki başka makinelerden açılamaz.
address = "127.0.0.1"
# M19.1: yazı tipleri app.py'nin yanındaki static/fonts klasöründen (yalnız bu bilgisayara) sunulur.
enableStaticServing = true

[browser]
serverAddress = "127.0.0.1"
# Kullanım istatistiği gönderilmez (uygulama internetsiz ve yerel çalışır).
gatherUsageStats = false

[client]
# M15.9: araç çubuğu en sade kipte; Streamlit'in "Deploy" düğmesi görünmez.
toolbarMode = "minimal"

[theme]
# M16.3 AuditTrace teması; değerler mufettis/ui/theme.py theme_flags() ile aynı (tests/test_theme.py).
base = "light"
primaryColor = "#1F5E55"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#EFEBE3"
textColor = "#1E2A32"
linkColor = "#1F5E55"
borderColor = "#DDD6C8"
dataframeBorderColor = "#DDD6C8"
dataframeHeaderBackgroundColor = "#EFEBE3"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "Libre Franklin, sans-serif"
headingFont = "Libre Baskerville, serif"
codeFont = "monospace"
redColor = "#B5382B"
redBackgroundColor = "#F6E5E1"
redTextColor = "#8E2B21"
orangeColor = "#A3741E"
orangeBackgroundColor = "#F5ECD8"
orangeTextColor = "#6E4C10"
yellowColor = "#A3741E"
yellowBackgroundColor = "#F5ECD8"
yellowTextColor = "#6E4C10"
greenColor = "#2F6B52"
greenBackgroundColor = "#E3EEE6"
greenTextColor = "#245640"
blueColor = "#1F5E55"
blueBackgroundColor = "#E4ECEA"
blueTextColor = "#1A4F47"
grayColor = "#7A8289"
grayBackgroundColor = "#EAE8E3"
grayTextColor = "#434C54"

[[theme.fontFaces]]
family = "Libre Franklin"
url = "app/static/fonts/LibreFranklin-wght.ttf"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Libre Franklin"
url = "app/static/fonts/LibreFranklin-Italic-wght.ttf"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/fonts/LibreBaskerville-wght.ttf"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/fonts/LibreBaskerville-Italic-wght.ttf"
weight = "400 700"
style = "italic"
