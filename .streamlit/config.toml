# AuditTrace — kaynaktan çalıştırma (`streamlit run app.py`) için Streamlit ayarları.
# Paket başlatıcısı (packaging/launcher.py) aynı ayarları kendisi verir. tests/test_streamlit_config.py korur.

[server]
# Yalnızca bu bilgisayar: belgeler yerel ağdaki başka makinelerden açılamaz.
address = "127.0.0.1"
# M19.1: yazı tipleri app.py'nin yanındaki static/fonts klasöründen (yalnız bu bilgisayara) sunulur.
enableStaticServing = true

[browser]
serverAddress = "127.0.0.1"
# Kullanım istatistiği gönderilmez (uygulama internetsiz ve yerel çalışır).
gatherUsageStats = false

[client]
# M15.9: araç çubuğu en sade kipte; Streamlit'in "Deploy" düğmesi görünmez.
toolbarMode = "minimal"

[theme]
# M16.3 AuditTrace teması; değerler mufettis/ui/theme.py theme_flags() ile aynı (tests/test_theme.py).
base = "light"
primaryColor = "#1A1A1A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F4F1"
textColor = "#1A1A1A"
linkColor = "#1A1A1A"
borderColor = "#DCDAD5"
dataframeBorderColor = "#DCDAD5"
dataframeHeaderBackgroundColor = "#F5F4F1"
showWidgetBorder = true
baseRadius = "6px"
buttonRadius = "6px"
font = "Libre Franklin, sans-serif"
headingFont = "Libre Baskerville, serif"
codeFont = "monospace"
redColor = "#C8102E"
redBackgroundColor = "#FBE6E9"
redTextColor = "#A30D25"
orangeColor = "#A88600"
orangeBackgroundColor = "#F7F0D6"
orangeTextColor = "#6B5300"
yellowColor = "#A88600"
yellowBackgroundColor = "#F7F0D6"
yellowTextColor = "#6B5300"
greenColor = "#3F7A3F"
greenBackgroundColor = "#E7F0E4"
greenTextColor = "#2D5A2D"
blueColor = "#1A1A1A"
blueBackgroundColor = "#EFEEEB"
blueTextColor = "#2B2B2B"
grayColor = "#8A8A86"
grayBackgroundColor = "#EFEEEB"
grayTextColor = "#444444"

[[theme.fontFaces]]
family = "Libre Franklin"
url = "app/static/fonts/LibreFranklin-wght.ttf"
weight = "100 900"
style = "normal"

[[theme.fontFaces]]
family = "Libre Franklin"
url = "app/static/fonts/LibreFranklin-Italic-wght.ttf"
weight = "100 900"
style = "italic"

[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/fonts/LibreBaskerville-wght.ttf"
weight = "400 700"
style = "normal"

[[theme.fontFaces]]
family = "Libre Baskerville"
url = "app/static/fonts/LibreBaskerville-Italic-wght.ttf"
weight = "400 700"
style = "italic"
